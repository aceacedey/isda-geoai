# Read the Docs configuration. The pages are notebooks with stored outputs, so the build installs
# only Sphinx, the notebook reader and the theme; it runs no analysis code.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
